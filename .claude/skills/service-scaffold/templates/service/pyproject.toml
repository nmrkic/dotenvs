[project]
name = "__PROJECT__-__SVC_DASH__"
version = "0.1.0"
description = "RabbitMQ worker — __DESCRIPTION__"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mrkutil==1.8.7.1",
    "sharedlib",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.37",
    "psycopg[binary]>=3.2.0",
    "alembic==1.14.1",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
    "pytest==9.1.1",
    "watchfiles==1.0.4",
    "coverage==7.16.1",
]

[project.scripts]
__SVC__ = "app.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
sharedlib = { path = "../shared", editable = true }

[tool.coverage.run]
source = ["app"]
omit = ["app/run.py", "app/alembic/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]
