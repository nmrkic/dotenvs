[project]
name = "sharedlib"
version = "0.1.0"
description = "__PROJECT_TITLE__ — shared package (DB config, base handler, service client, exchanges)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.37",
    "psycopg[binary]>=3.2.0",
    "mrkutil==1.8.7.1",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
    "pytest==9.1.1",
    "coverage==7.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sharedlib"]

[tool.coverage.run]
source = ["sharedlib"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E501"]
