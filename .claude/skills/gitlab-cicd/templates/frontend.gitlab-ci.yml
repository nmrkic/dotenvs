    - ''
  after_script:
    - ''
  image: dtzar/helm-kubectl
  script:
    - kubectl config get-contexts
    - kubectl config use-context __GITLAB_GROUP__/__REPO__:__AGENT_DEMO__
    - kubectl get pods
    - APP_VERSION=`grep APP_VERSION .env | xargs`
    - APP_VERSION=${APP_VERSION#*=}
    - echo releasing version $APP_VERSION to demo
    - helm list
    - helm upgrade --install __PROJECT__-front-demo ./kubernetes/charts/demo/ --set app_version=${APP_VERSION}
    - kubectl describe deploy | grep Image
  manual_confirmation: 'You are deploying to Demo! Are you sure?'
  rules:
    - if: "$CI_COMMIT_TAG"
      when: manual


deploy-prod-arm:
  stage: deploy
  before_script:
    - ''
  after_script:
    - ''
  image: dtzar/helm-kubectl
  script:
    - kubectl config get-contexts
    - kubectl config use-context __GITLAB_GROUP__/__REPO__:__AGENT_PROD__
    - kubectl get pods
    - APP_VERSION=`grep APP_VERSION .env | xargs`
    - APP_VERSION=${APP_VERSION#*=}
    - echo releasing version $APP_VERSION to prod
    - helm list
    - helm upgrade --install __PROJECT__-front-prod ./kubernetes/charts/prod/ --set app_version=${APP_VERSION}
