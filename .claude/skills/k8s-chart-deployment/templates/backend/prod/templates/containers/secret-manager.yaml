---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: __PROJECT__-secrets-service-account
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: __EXTERNAL_SECRETS_ROLE_ARN__

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: __PROJECT__-secrets-store
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: __AWS_REGION__
      auth:
        jwt:
          serviceAccountRef:
            name: __PROJECT__-secrets-service-account
            namespace: default
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: __PROJECT__-db-certificate
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: __PROJECT__-secrets-store
    kind: SecretStore
  target:
    name: __PROJECT__-db-certificate
    creationPolicy: Owner
  data:
  - secretKey: __PROJECT__-production-mysql-cert.pem
    remoteRef:
      key: production/__PROJECT__/db_certificate
