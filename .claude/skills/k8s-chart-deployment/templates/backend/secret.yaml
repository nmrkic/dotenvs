---
# Lives at kubernetes/secret.yaml (kubernetes/<env>-secret.yaml for other envs), OUTSIDE the charts.
# Applied by hand: kubectl apply -f kubernetes/secret.yaml
# Must stay git-ignored (`*secret.yaml` in .gitignore). Never fill in real values yourself.
kind: ConfigMap
apiVersion: v1
metadata:
  name: secret-config
data:
  RABBITMQ_HOST: rabbit-service
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: CHANGE_ME
  RABBITMQ_PASSWORD: CHANGE_ME
  RABBITMQ_VHOST: CHANGE_ME

  RABBITMQ_DEFAULT_USER: CHANGE_ME
  RABBITMQ_DEFAULT_PASS: CHANGE_ME
  RABBITMQ_DEFAULT_VHOST: CHANGE_ME
  RABBIT_URL: CHANGE_ME

  DB_USERNAME: CHANGE_ME
  DB_PASSWORD: CHANGE_ME
  MYSQL_ROOT_PASSWORD: CHANGE_ME

  JWT_SECRET: CHANGE_ME
