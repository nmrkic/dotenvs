apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-pv-volume
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/minio"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - __NODE__
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pv-claim
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: '{{ $.Values.sharedRegistry }}/minio:RELEASE.2024-04-18T19-09-19Z'
        imagePullPolicy: "IfNotPresent"
        command:
        - /bin/bash
        - -c
        args:
        - minio server --address ":9000" --console-address ":9001" /data
        volumeMounts:
        - mountPath: /data
          name: minio-persistent-storage
        envFrom:
        - configMapRef:
            name: minio-config
      imagePullSecrets:
      - name: regcred-shared
      nodeSelector:
        kubernetes.io/hostname: __NODE__
      volumes:
      - name: minio-persistent-storage
        persistentVolumeClaim:
          claimName: minio-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
spec:
  ports:
  - name: "9000"
    port: 9000
    targetPort: 9000
  - name: "9001"
    port: 9001
    targetPort: 9001
  selector:
    app: minio
