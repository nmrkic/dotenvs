---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-__ENV__-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/acme-challenge-type: http01
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "64k"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - storage.__HOST__
        - storage-console.__HOST__
      secretName: letsencrypt-minio-secret
  rules:
  - host: storage-console.__HOST__
    http:
      paths:
      - path: /
        pathType: "Prefix"
        backend:
          service:
            name: minio-service
            port:
              number: 9001
  - host: storage.__HOST__
    http:
      paths:
      - path: /
        pathType: "Prefix"
        backend:
          service:
            name: minio-service
            port:
              number: 9000
