---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: __ENV__-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/acme-challenge-type: http01
    nginx.ingress.kubernetes.io/proxy-ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "64k"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - __HOST__
      secretName: letsencrypt-secret
  rules:
  - host: __HOST__
    http:
      paths:
      - path: /openapi.json
        pathType: ImplementationSpecific
        backend:
          service:
            name: rest-api
            port:
              number: 8080
      - path: /
        pathType: "Prefix"
        backend:
          service:
            name: front
            port:
              number: 80
      - path: /__PROJECT__-api
        pathType: "Prefix"
        backend:
          service:
            name: rest-api
            port:
              number: 8080
      - path: /docs
        pathType: "Prefix"
        backend:
          service:
            name: rest-api
            port:
              number: 8080
      - path: /redoc
        pathType: "Prefix"
        backend:
          service:
            name: rest-api
            port:
              number: 8080
