app_version: "0.0.1"

registry: reg.bwl.rs/__PROJECT__

sharedRegistry: reg.bwl.rs/shared

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

crons:
  - name: example-daily-job
    command: "/opt/app/config/run.sh example_task example_exchange"
    schedule: "0 6 * * *"

services:
  - name: user
    replicas: 1
  - name: notify
    replicas: 1
