app_version: "0.0.1"

registry: reg.bwl.rs/__PROJECT__

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# One entry per frontend app. Each needs templates/config/<name>.yaml
# defining a ConfigMap called <name>-config.
services:
  - name: front
    replicas: 1
    port: 3000
